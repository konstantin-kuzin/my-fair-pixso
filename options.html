<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>My Fair Pixso</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 350px;
        max-height: 560px;
        margin: 0;
        box-sizing: border-box;
        color: #1a1a1a;
        font-size: 0.9rem;
      }
      .container {
        padding: 16px;
        overflow-y: auto;
      }
      h1 {
        font-size: 1.05rem;
        font-weight: 600;
      }
      h2 {
        font-size: 0.95rem;
        margin: 16px 0 10px;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        font-size: 0.88rem;
        line-height: 1.35;
      }
      .row {
        margin-bottom: 12px;
      }
      .row label {
        display: block;
        cursor: default;
        margin-bottom: 6px;
        font-size: 0.85rem;
      }
      input[type='number'] {
        width: 48px;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #e0e0e0;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #e0e0e0;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      .hint {
        font-size: 0.8rem;
        color: #555;
        margin-top: 8px;
        line-height: 1.4;
      }
      .ok {
        color: #0a0;
        margin-top: 6px;
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      code {
        font-size: 0.85em;
      }
      .conditional-block.is-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Fair Pixso</h1>
      <div class="hint" style="margin-bottom: 1em;">Pixso с преферансом и куртизанками</div>
      <!-- <h2>Интерфейс</h2> -->
      <label>
        <input type="checkbox" id="trimPlugins" />
        Скрыть Enterprise plugins
      </label>
      <label>
        <input type="checkbox" id="exportPixButton" />
        Добавить на панель кнопку сохранения 
      </label>
      <label>
        <input type="checkbox" id="enabled" />
        Автосохранение в файл
      </label>
      <div id="intervalRow" class="row conditional-block">раз в <input type="number" id="interval" min="1" max="120" step="1" value="10" /> мин.
      </div>
      <label>
        <input type="checkbox" id="renamePix" />
        Шаблон имени сохраняемого файла
      </label>
      <div id="templateBlock" class="row conditional-block">
        <input
          type="text"
          id="template"
          spellcheck="false"
          placeholder="{{date}} {{title}}.pix"
        />
        <p class="hint">
          <code>{{date}}</code>, <code>{{title}}</code>, <code>{{raw}}</code>
        </p>
      </div>
      <button type="button" id="save">Сохранить</button>
      <span class="ok" id="status" style="margin-left: 1em;"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
